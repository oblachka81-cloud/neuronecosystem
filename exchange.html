const BASE_URL = 'https://neuron1.bothost.tech';
const urlParams = new URLSearchParams(window.location.search);
const currentLang = urlParams.get('lang') || 'ru';
const t = LANG[currentLang] || LANG['ru'];

// Применяем переводы
document.getElementById('walletLabel').textContent = t.walletLabel;
document.getElementById('fiatBtnText').textContent = t.fiatBtn;
document.getElementById('walletAddr').textContent = t.notConnected;
document.getElementById('connectWalletBtn').textContent = t.connectBtn;

document.getElementById('toLabel').textContent = t.toLabel;

  window.location.href = '/?lang=' + currentLang;
};

const tg = window.Telegram?.WebApp ?? { initData: '' };
tg.ready?.();
tg.expand?.();

let rates = {};
let walletConnected = false;
let walletAddress = '';
let tonConnectUI = null;

async function initTonConnect() {
  for (let i = 0; i < 50; i++) {
    if (window.TON_CONNECT_UI) break;
    await new Promise(r => setTimeout(r, 100));
  }
  if (window.TON_CONNECT_UI) {
    tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://neuron1.bothost.tech/tonconnect-manifest.json'
    });
    window.tonConnectUI = tonConnectUI;
  }
  const savedAddress = localStorage.getItem('walletAddress');
if (savedAddress && tonConnectUI?.wallet) {
  walletConnected = true;
  walletAddress = savedAddress;
  document.getElementById('walletAddr').textContent = walletAddress.slice(0,6) + '...' + walletAddress.slice(-4);
  document.getElementById('swapBtn').disabled = false;
} else if (savedAddress) {
  walletAddress = savedAddress;
  document.getElementById('walletAddr').textContent = walletAddress.slice(0,6) + '...' + walletAddress.slice(-4);
}
}

function authFetch(url, opts = {}) {
  const initData = tg.initData || '';
  return fetch(url, { ...opts, headers: { ...(opts.headers || {}), 'X-Telegram-Init-Data': initData } });
}

function showToast(msg, dur=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.style.display = 'none', 300); }, dur);
}

async function loadRates() {
  try {
    const res = await fetch(`${BASE_URL}/api/exchange/rates`);
    const data = await res.json();
    if (data.success) {
      rates = data.rates;
      renderPairs();
      calcSwap();
    }
  } catch (e) {
    console.error('Rates error:', e);
    document.getElementById('pairsGrid').innerHTML = '<div class="loader">Не удалось загрузить курсы</div>';
  }
}

function calcSwap() {
  const from = document.getElementById('fromCurrency').value;
  const to = document.getElementById('toCurrency').value;
  const amount = parseFloat(document.getElementById('fromAmount').value) || 0;
  const pair = `${from}/${to}`;
  const rate = rates[pair];
  if (rate && amount > 0) {
    const raw = amount * rate;
    const fee = raw * 0.003;
    const result = raw - fee;
    document.getElementById('toAmount').value = result.toFixed(6);
    document.getElementById('rateInfo').textContent = `1 ${from} = ${rate.toFixed(6)} ${to}`;
    document.getElementById('swapBtn').disabled = !walletConnected;
  } else {
    document.getElementById('toAmount').value = '';
    document.getElementById('rateInfo').textContent = '—';
    document.getElementById('swapBtn').disabled = true;
  }
  const feeRow = document.getElementById('cogniqFeeRow');
if (feeRow) {
  feeRow.style.display = (amount > 0) ? 'block' : 'none';
}
}

function swapCurrencies() {
  const from = document.getElementById('fromCurrency');
  const to = document.getElementById('toCurrency');
  const tmp = from.value;
  from.value = to.value;
  to.value = tmp;
  calcSwap();
}

async function connectWallet() {
  if (!tonConnectUI) await initTonConnect();
  if (!tonConnectUI) { showToast(t.toastNotLoaded); return; }
  
  const wallet = tonConnectUI.wallet;
if (wallet) {
  walletConnected = true;
  walletAddress = wallet.account.address;
  localStorage.setItem('walletAddress', walletAddress);
  localStorage.setItem('walletConnected', 'true');
  document.getElementById('walletAddr').textContent = walletAddress.slice(0,6) + '...' + walletAddress.slice(-4);
  document.getElementById('swapBtn').disabled = false;
  showToast(t.toastConnected);
} else {
    try {
      await tonConnectUI.openModal();
    } catch(e) {
      showToast('Не удалось подключить кошелёк');
    }
  }
}

function hexToBase64(hex) {
    if (!hex) return '';
    const clean = hex.replace(/[^0-9a-fA-F]/g, '');
    if (clean.length === 0 || clean.length % 2 !== 0) return '';
    let binary = '';
    for (let i = 0; i < clean.length; i += 2) {
        binary += String.fromCharCode(parseInt(clean.substr(i, 2), 16));
    }
    return btoa(binary);
}

async function doSwap() {
  if (!walletConnected) { showToast(t.toastNeedWallet); return; }
  const from = document.getElementById('fromCurrency').value;
  const to = document.getElementById('toCurrency').value;
  const amount = parseFloat(document.getElementById('fromAmount').value);
  if (!amount || amount <= 0) { showToast(t.toastEnterAmount); return; }
  
  const btn = document.getElementById('swapBtn');
  btn.disabled = true;
  btn.textContent = 'Обработка...';
  
  try {
    const res = await authFetch(`${BASE_URL}/api/exchange/swap`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fromCurrency: from, toCurrency: to, fromAmount: amount })
    });
    const data = await res.json();
    
    if (data.success) {
      showToast(`Сделка создана. Комиссия: ${data.fee.toFixed(6)} ${to} + 5 COGNIQ (gas). Подтвердите в TON Connect.`);
      
      const swapDataRes = await authFetch(`${BASE_URL}/api/exchange/swap-data`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fromCurrency: from, toCurrency: to, fromAmount: amount, walletAddress: walletAddress })
      });
      const swapData = await swapDataRes.json();

      if (!swapData.success) {
    if (swapData.error && swapData.error.includes('COGNIQ')) {
        showToast('Недостаточно COGNIQ! Нужно ' + (swapData.required || 5) + '. Баланс: ' + (swapData.balance || 0));
    } else {
        showToast('Ошибка свопа');
    }
    return;
}
if (!swapData.messages?.length) {
    showToast('Ошибка свопа');
    return;
}

      const validMessages = swapData.messages.map(m => {
        const msg = { address: m.address, amount: String(m.amount) };
        if (m.payload && m.payload.length > 0) {
          const isHex = /^[0-9a-fA-F]+$/.test(m.payload);
          msg.payload = isHex ? hexToBase64(m.payload) : m.payload;
        }
        if (m.stateInit && m.stateInit.length > 0) {
          const isHex = /^[0-9a-fA-F]+$/.test(m.stateInit);
          msg.stateInit = isHex ? hexToBase64(m.stateInit) : m.stateInit;
        }
        return msg;
      });

      const transaction = {
        validUntil: Math.floor(Date.now() / 1000) + 600,
        messages: validMessages
      };

      await tonConnectUI.sendTransaction(transaction);
      
      try {
        await authFetch(`${BASE_URL}/api/exchange/confirm`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ swapId: data.swapId })
        });
      } catch (e) {
        console.error('Confirm failed:', e);
      }
      
      showToast(t.toastSwapOk);
      loadHistory();
    }
  } catch (err) {
    console.error('Swap error:', err);
    showToast('❌ Ошибка: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Обменять';
  }
}

function renderPairGrid(id, pairsList) {
  const grid = document.getElementById(id);
  const isXstocks = (id === 'pairsXstocks');
  grid.innerHTML = pairsList.map(p => {
    const rate = rates[`${p.from}/${p.to}`];
    const stockPrice = isXstocks ? rates[`${p.from}_STOCK_PRICE`] : null;
    return `<div class="pair-card" onclick="selectPair('${p.from}','${p.to}')" style="position:relative;background:none;border:none;padding:0;">
      <img src="/public/images/cogniq/exchange_pair_card.png" style="width:100%;display:block;">
      <div style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding:0 36px 0 12px;">
        <div style="font-size:0.8rem;font-weight:600;color:#ffcc44;margin-bottom:4px;">${p.name}</div>
        <div style="font-size:0.75rem;color:#ffcc44;">${rate ? rate.toFixed(4) : '—'}</div>
        ${stockPrice ? `<div style="font-size:0.65rem;opacity:0.7;color:#ffcc44;">акция: $${stockPrice.toFixed(2)}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function switchPairTab(tab) {
  const crypto = document.getElementById('pairsCrypto');
  const xstocks = document.getElementById('pairsXstocks');
  const tabCryptoImg = document.querySelector('#tabCrypto img');
  const tabXstocksImg = document.querySelector('#tabXstocks img');
  
  if (tab === 'crypto') {
    crypto.style.display = 'grid';
    xstocks.style.display = 'none';
    tabCryptoImg.style.filter = 'brightness(1.2)';
    tabXstocksImg.style.filter = 'brightness(0.6)';
  } else {
    crypto.style.display = 'none';
    xstocks.style.display = 'grid';
    tabXstocksImg.style.filter = 'brightness(1.2)';
    tabCryptoImg.style.filter = 'brightness(0.6)';
  }
}

function selectPair(from, to) {
  document.getElementById('fromCurrency').value = from;
  document.getElementById('toCurrency').value = to;
  calcSwap();
}

async function loadHistory() {
  try {
    const res = await authFetch(`${BASE_URL}/api/exchange/history`);
    const data = await res.json();
    if (data.success && data.swaps && data.swaps.length) {
      document.getElementById('historyList').innerHTML = data.swaps.map(s => `
        <div class="history-item">
          <div>
            <div style="color:#cceeff;font-weight:600;">${s.from_currency} → ${s.to_currency}</div>
            <div style="color:#fff;">${s.from_amount} → ${s.to_amount}</div>
            <div style="color:#ffaa00;font-size:0.72rem;margin-top:2px;">⛽ Gas: ${s.cogniq_fee || 5} COGNIQ</div>
          </div>
          <div class="status-${s.status}">${s.status === 'completed' ? t.completed : t.pending}</div>
        </div>`).join('');
    } else {
      document.getElementById('historyList').innerHTML = '<div class="loader">' + t.noHistory + '</div>';
    }
  } catch (e) {
    console.error('History error:', e);
  }
}

initTonConnect();
loadRates();
loadHistory();
setInterval(loadRates, 60000);
  // === ПЛАВНОЕ ВКЛЮЧЕНИЕ ВИДЕО-ФОНА ДЛЯ БИРЖИ ===
(function() {
    const videoContainer = document.getElementById('liveBgVideo');
    const video = document.getElementById('exchangeBgVid');
    if (!videoContainer || !video) return;

    // Начинаем загрузку видео сразу
    video.load();

    // Как только видео готово к плавному воспроизведению
    video.addEventListener('canplaythrough', function() {
        video.play().catch(function() {
            // Если браузер заблокировал автоплей, просто оставляем WebP
            console.log('Autoplay blocked, keeping static WebP');
        });
        // Плавно показываем видео поверх WebP (за 1.5 секунды, как в CSS)
        videoContainer.style.opacity = '1';
    });

    // Страховка: если видео грузится дольше 6 секунд, просто оставляем WebP
    setTimeout(function() {
        if (videoContainer.style.opacity !== '1') {
            console.log('Video load timeout, keeping static WebP');
        }
    }, 6000);
})();
// === КОНЕЦ ПЛАВНОГО ВКЛЮЧЕНИЯ ===
</script>
