<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEURON FIAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=block" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: none; font-family: 'Inter', -apple-system, sans-serif; color: #ddeeff; min-height: 100vh; padding: 20px 12px 40px; display: flex; justify-content: center; overflow-x: hidden; }
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: url('/public/images/cogniq/cogniq_exchange_bg.webp') center/cover no-repeat;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 1;
}
#particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; overflow: hidden; }
.particle { position: absolute; border-radius: 50%; animation: floatUp linear infinite; opacity: 0; }
@keyframes floatUp { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-10vh) scale(1); opacity: 0; } }
.fiat-card { max-width: 480px; width: 100%; margin: 0 auto; padding: 24px 16px; position: relative; z-index: 3; }
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,10,25,0.97); border: 1px solid rgba(255,170,0,0.4); border-radius: 16px; padding: 14px 24px; font-size: 0.95rem; color: #ffaa00; z-index: 9999; transition: opacity 0.3s; max-width: 90vw; box-shadow: 0 0 30px rgba(255,120,0,0.3); animation: toastIn 0.3s ease; }
@keyframes toastIn { from { transform: translateX(-50%) translateY(20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
button { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; font-family: inherit; }

/* Переключатель КУПИТЬ/ПРОДАТЬ */
.mode-switcher { display: flex; gap: 8px; margin-bottom: 20px; background: rgba(10,20,38,0.6); padding: 6px; border-radius: 14px; border: 1px solid rgba(255,170,0,0.15); }
.mode-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #5577aa; font-size: 0.9rem; font-weight: 700; border-radius: 10px; cursor: pointer; transition: all 0.3s; }
.mode-btn.active { background: rgba(0,255,170,0.15); color: #00ffaa; box-shadow: 0 0 15px rgba(0,255,170,0.2); }

/* Селекты валют */
.currency-block { margin-bottom: 16px; }
.currency-label { font-size: 0.75rem; color: #5577aa; margin-bottom: 6px; font-weight: 600; }
.currency-selector { background: rgba(10,20,38,0.8); border: 1px solid rgba(255,170,0,0.2); border-radius: 12px; padding: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: border-color 0.2s; }
.currency-selector:active { border-color: rgba(255,170,0,0.5); }
.currency-selector .value { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; font-weight: 600; color: #fff; flex: 1; min-width: 0; }
.currency-selector .value-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.currency-selector .arrow { color: #ffaa00; font-size: 0.8rem; flex-shrink: 0; }

/* Калькулятор */
.calc-block { background: rgba(10,20,38,0.8); border: 1px solid rgba(255,170,0,0.15); border-radius: 14px; padding: 16px; margin-bottom: 20px; }
.calc-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,170,0,0.2); border-radius: 12px; padding: 14px; color: #fff; font-size: 1.1rem; font-weight: 700; outline: none; font-family: inherit; }
.calc-input:focus { border-color: rgba(0,255,170,0.5); }
.calc-result { margin-top: 12px; padding: 12px; background: rgba(0,255,170,0.05); border-radius: 10px; text-align: center; }
.calc-result .amount { font-size: 1.3rem; font-weight: 800; color: #00ffaa; }
.calc-result .rate { font-size: 0.75rem; color: #5577aa; margin-top: 4px; }

/* Карточки обменников */
.exchangers-title { font-size: 0.85rem; font-weight: 700; color: #ffaa00; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.exchangers-title .count { color: #5577aa; font-size: 0.75rem; font-weight: 400; }
.exchanger-card { background: rgba(10,20,38,0.8); border: 1px solid rgba(255,170,0,0.15); border-radius: 14px; padding: 14px; margin-bottom: 10px; animation: fadeIn 0.4s ease; }
.exchanger-card.best { border-color: rgba(0,255,170,0.4); box-shadow: 0 0 15px rgba(0,255,170,0.1); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.exchanger-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
.exchanger-name { font-size: 0.95rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exchanger-rating { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: #ffcc44; flex-shrink: 0; }
.exchanger-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; font-size: 0.78rem; }
.exchanger-stats .stat { color: #aabbcc; }
.exchanger-stats .stat strong { color: #fff; font-weight: 600; }
.exchanger-btn { width: 100%; padding: 10px; background: rgba(0,255,170,0.1); border: 1px solid rgba(0,255,170,0.3); border-radius: 10px; color: #00ffaa; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.exchanger-btn:active { transform: scale(0.98); background: rgba(0,255,170,0.2); }

/* Кнопка "Найти другой способ" */
.find-more-btn { width: 100%; padding: 14px; margin-top: 20px; background: rgba(255,170,0,0.08); border: 1px solid rgba(255,170,0,0.25); border-radius: 14px; color: #ffaa00; font-size: 0.9rem; font-weight: 700; cursor: pointer; text-align: center; letter-spacing: 0.5px; }
.find-more-btn:active { transform: scale(0.98); background: rgba(255,170,0,0.15); }

/* Модальное окно */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
.modal-overlay.active { display: flex; }
.modal-content { background: rgba(10,18,38,0.98); border: 1px solid rgba(255,170,0,0.3); border-radius: 20px; padding: 24px 20px; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto; }
.modal-title { font-size: 1.1rem; font-weight: 800; color: #ffaa00; margin-bottom: 16px; text-align: center; }
.modal-search { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,170,0,0.2); border-radius: 10px; color: #fff; font-size: 0.9rem; outline: none; margin-bottom: 12px; font-family: inherit; }
.modal-list { display: flex; flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto; }
.modal-item { padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; transition: all 0.2s; }
.modal-item:active { background: rgba(0,255,170,0.1); border-color: rgba(0,255,170,0.3); }
.modal-item .name { font-size: 0.9rem; font-weight: 600; color: #fff; }
.modal-item .code { font-size: 0.75rem; color: #5577aa; margin-top: 2px; }
.modal-close { width: 100%; padding: 12px; margin-top: 16px; background: rgba(255,170,0,0.1); border: 1px solid rgba(255,170,0,0.3); border-radius: 12px; color: #ffaa00; font-size: 0.9rem; font-weight: 700; cursor: pointer; }

/* Loader */
.loader { text-align: center; padding: 20px; color: #5577aa; font-size: 0.85rem; }
.loader-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(255,170,0,0.2); border-top-color: #ffaa00; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .exchanger-stats { font-size: 0.72rem; }
}
</style>
</head>

    <video id="fiatBgVid" muted playsinline loop preload="auto" style="width: 100%; height: 100%; object-fit: cover;">

<div class="fiat-card">

  <!-- Кнопка выхода -->
  <button id="backBtn" style="background:none;border:none;padding:0;cursor:pointer;margin-bottom:16px;">
    <img id="backBtnImg" src="/public/images/cogniq/exchange_back_ru.png" style="height:44px;width:auto;display:block;">
  </button>

  <!-- Логотип -->
  <div style="text-align:center;margin-bottom:20px;">
    <img src="/public/images/cogniq/exchange_logo.png" alt="NEURON" style="height:160px;width:auto;display:block;margin:0 auto;">
  </div>

  <!-- Переключатель КУПИТЬ/ПРОДАТЬ -->
  <div class="mode-switcher" style="display:flex;gap:8px;background:transparent;padding:0;border:none;">
    <button class="mode-btn active" id="buyBtn" onclick="setMode('buy')" style="position:relative;flex:1;padding:0;border:none;background:none;cursor:pointer;">
        <img src="/exchange/fiat_tab.webp" style="width:100%;height:52px;display:block;object-fit:fill;border-radius:12px;">
        <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:700;font-size:0.9rem;color:#ffcc44;white-space:nowrap;" id="buyText">КУПИТЬ</span>
    </button>
    <button class="mode-btn" id="sellBtn" onclick="setMode('sell')" style="position:relative;flex:1;padding:0;border:none;background:none;cursor:pointer;">
        <img src="/exchange/fiat_tab.webp" style="width:100%;height:52px;display:block;object-fit:fill;border-radius:12px;filter:brightness(0.5);">
        <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:700;font-size:0.9rem;color:#8899aa;white-space:nowrap;" id="sellText">ПРОДАТЬ</span>
    </button>
</div>

<!-- Получаю -->
<div class="currency-block">
  <div class="currency-label" id="toLabel">Получаю</div>
  <div class="currency-selector" onclick="openModal('to')" style="position:relative;background:none;border:none;padding:0;">
    <img src="/exchange/fiat_selector.webp" style="width:100%;height:52px;display:block;object-fit:fill;border-radius:12px;">
    <div class="value" style="position:absolute;top:50%;left:14px;transform:translateY(-50%);display:flex;align-items:center;gap:10px;">
      <span class="value-text" id="toValue" style="font-size:0.95rem;font-weight:600;color:#fff;">Загрузка...</span>
    </div>
    <div class="arrow" style="position:absolute;top:50%;right:14px;transform:translateY(-50%);color:#00ffaa;font-size:1.1rem;">▼</div>
  </div>
</div>

<!-- Калькулятор -->
<div class="calc-block" style="position:relative;background:none;border:none;padding:0;">
    <img src="/exchange/fiat_calc.webp" style="width:100%;height:180px;display:block;object-fit:fill;border-radius:12px;">
    <input type="number" class="calc-input" id="calcInput" placeholder="0.00" oninput="calculate()" inputmode="decimal" style="position:absolute;top:16px;left:16px;right:16px;width:auto;background:rgba(0,0,0,0.5);border:1px solid rgba(255,170,0,0.2);border-radius:12px;padding:14px;color:#fff;font-size:1.1rem;font-weight:700;outline:none;font-family:inherit;">
    <div class="calc-result" style="position:absolute;bottom:16px;left:16px;right:16px;background:rgba(0,255,170,0.05);border-radius:10px;padding:12px;text-align:center;">
      <div class="amount" id="calcResult">≈ 0.00</div>
      <div class="rate" id="calcRate">—</div>

  <!-- Список обменников -->
  <div class="exchangers-title">
    <span id="exchangersTitle">Лучшие обменники</span>
    <span class="count" id="exchangersCount"></span>
  </div>
  <div id="exchangersList">
    <div class="loader"><div class="loader-spinner"></div></div>
  </div>
  <button id="loadMoreBtn" onclick="loadMoreExchangers()" style="display:none;width:100%;padding:14px;margin-top:16px;background:rgba(255,170,0,0.1);border:1px solid rgba(255,170,0,0.3);border-radius:14px;color:#ffaa00;font-size:0.9rem;font-weight:700;cursor:pointer;">
  🔽 Загрузить ещё
</button>

  <!-- Кнопка "Найти другой способ" -->
  <button class="find-more-btn" id="findMoreBtn" onclick="openBestChange()">🔍 <span id="findMoreText">Найти другой способ обмена</span></button>

</div>

<!-- Модальное окно выбора валюты -->
<div class="modal-overlay" id="currencyModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content">
    <div class="modal-title" id="modalTitle">Выберите валюту</div>
    <input type="text" class="modal-search" id="modalSearch" placeholder="Поиск..." oninput="filterCurrencies()">
    <div class="modal-list" id="modalList"></div>
    <button class="modal-close" onclick="closeModal()" id="modalCloseBtn">Закрыть</button>
  </div>
</div>

<div class="toast" id="toast" style="display:none;"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// ===== МУЛЬТИЯЗЫЧНОСТЬ =====
const LANG = {
  ru: {
    buy: 'КУПИТЬ', sell: 'ПРОДАТЬ', from: 'Отдаю', to: 'Получаю',
    exchangersTitle: 'Лучшие обменники', findMore: 'Найти другой способ обмена',
    modalTitleFrom: 'Выберите валюту (отдаю)', modalTitleTo: 'Выберите валюту (получаю)',
    search: 'Поиск...', close: 'Закрыть',
    reserve: 'Резерв', minMax: 'Мин/Макс', goTo: 'Перейти к обмену',
    bestRate: 'Лучший курс', reviews: 'отзывов', loading: 'Загрузка...',
    noExchangers: 'Нет доступных обменников для этой пары', error: 'Ошибка загрузки'
  },
  en: {
    buy: 'BUY', sell: 'SELL', from: 'You give', to: 'You get',
    exchangersTitle: 'Best exchangers', findMore: 'Find another exchange method',
    modalTitleFrom: 'Select currency (give)', modalTitleTo: 'Select currency (get)',
    search: 'Search...', close: 'Close',
    reserve: 'Reserve', minMax: 'Min/Max', goTo: 'Go to exchange',
    bestRate: 'Best rate', reviews: 'reviews', loading: 'Loading...',
    noExchangers: 'No exchangers for this pair', error: 'Load error'
  },
  fr: {
    buy: 'ACHETER', sell: 'VENDRE', from: 'Donner', to: 'Recevoir',
    exchangersTitle: 'Meilleurs échangeurs', findMore: 'Trouver une autre méthode',
    modalTitleFrom: 'Sélectionner (donner)', modalTitleTo: 'Sélectionner (recevoir)',
    search: 'Rechercher...', close: 'Fermer',
    reserve: 'Réserve', minMax: 'Min/Max', goTo: 'Aller à l\'échange',
    bestRate: 'Meilleur taux', reviews: 'avis', loading: 'Chargement...',
    noExchangers: 'Aucun échangeur pour cette paire', error: 'Erreur'
  },
  es: {
    buy: 'COMPRAR', sell: 'VENDER', from: 'Dar', to: 'Recibir',
    exchangersTitle: 'Mejores cambiadores', findMore: 'Encontrar otro método',
    modalTitleFrom: 'Seleccionar (dar)', modalTitleTo: 'Seleccionar (recibir)',
    search: 'Buscar...', close: 'Cerrar',
    reserve: 'Reserva', minMax: 'Min/Máx', goTo: 'Ir al intercambio',
    bestRate: 'Mejor tasa', reviews: 'reseñas', loading: 'Cargando...',
    noExchangers: 'Sin cambiadores para este par', error: 'Error'
  }
};

const urlParams = new URLSearchParams(window.location.search);
const currentLang = urlParams.get('lang') || 'ru';
const t = LANG[currentLang] || LANG['ru'];

// Применяем переводы
document.getElementById('buyText').textContent = t.buy;
document.getElementById('sellText').textContent = t.sell;
document.getElementById('fromLabel').textContent = t.from;
document.getElementById('toLabel').textContent = t.to;
document.getElementById('exchangersTitle').textContent = t.exchangersTitle;
document.getElementById('findMoreText').textContent = t.findMore;
document.getElementById('modalCloseBtn').textContent = t.close;
document.getElementById('modalSearch').placeholder = t.search;
document.getElementById('backBtnImg').src = '/public/images/cogniq/exchange_back_' + currentLang + '.png';
document.getElementById('backBtn').onclick = function() {
window.location.href = '/?lang=' + currentLang + '&tab=exchange';
};

// ===== TELEGRAM WEBAPP =====
const tg = window.Telegram?.WebApp ?? { initData: '' };
tg.ready?.();
tg.expand?.();

// ===== СОСТОЯНИЕ =====
let currentMode = 'buy';
let currentFrom = null; // { id, name, ... }
let currentTo = null;
let allCurrencies = []; // из API
let changersMap = {}; // id -> changer info
let currentRates = []; // массив обменников для текущей пары
let allRates = [];
let displayedCount = 10;
let partnerId = '1344120'; // по умолчанию

// ===== ПОПУЛЯРНЫЕ ВАЛЮТЫ (для быстрого выбора) =====
const POPULAR_FIAT_NAMES = {
  'Сбербанк': '🇷🇺', 'Тинькофф': '🇷🇺', 'QIWI': '🇷🇺', 'ЮMoney': '🇷🇺',
  'Visa/MasterCard (RUB)': '🇷🇺', 'Russian Standard Bank': '🇷🇺',
  'SEPA': '🇪🇺', 'Revolut': '🌍', 'Wise': '🌍', 'N26': '🇩🇪',
  'PayPal': '🌍', 'SWIFT': '🌍',
  'ACH Transfer': '🇺🇸', 'Wire Transfer': '🇺🇸', 'Zelle': '🇺🇸',
  'Kaspi Bank': '🇰🇿', 'Halyk Bank': '🇰🇿',
  'Monobank': '🇺🇦', 'PrivatBank': '🇺🇦',
  'Visa/MasterCard (USD)': '🇺🇸', 'Visa/MasterCard (EUR)': '🇪🇺'
};

const POPULAR_CRYPTO = ['Tether TRC20', 'Tether ERC20', 'Tether Toncoin', 'Toncoin', 'Bitcoin', 'Ethereum'];

function isLikelyFiat(currency) {
  if (currency.crypto === true) return false;
  if (currency.crypto === false) return true;
  const name = (currency.viewname || currency.name || '').toLowerCase();
  const cryptoNames = ['bitcoin', 'ethereum', 'toncoin', 'tether', 'usdt', 'usdc', 'bnb', 'solana', 'ripple', 'cardano', 'dogecoin', 'polkadot', 'litecoin', 'btc', 'eth', 'sol', 'xrp', 'ada', 'doge', 'dot', 'ltc', 'ton'];
  for (const cn of cryptoNames) { if (name.includes(cn)) return false; }
  return true;
}

// ===== ЗАГРУЗКА ДАННЫХ =====
async function loadPartnerId() {
  try {
    const res = await fetch('/api/bestchange/partner-id');
    const data = await res.json();
    if (data.success && data.partnerId) partnerId = data.partnerId;
  } catch (e) {
    console.warn('Partner ID load failed, using default');
  }
}

async function loadCurrencies() {
  try {
    const res = await fetch(`/api/bestchange/currencies/${currentLang}`);
    const data = await res.json();
    if (data.success && data.data?.currencies) {
      allCurrencies = data.data.currencies;
      // Строим карту
      const map = {};
      allCurrencies.forEach(c => map[c.id] = c);
      
      // Разделяем на фиат и крипто
      const fiat = allCurrencies.filter(isLikelyFiat);
      const crypto = allCurrencies.filter(c => !isLikelyFiat(c));
      
      // Дефолтные значения
      // Ищем RUB Сбербанк или похожее
      const defaultFromFiat = fiat.find(c => 
        (c.viewname || '').toLowerCase().includes('сбер') || 
        (c.viewname || '').toLowerCase().includes('sber')
      ) || fiat.find(c => (c.viewname || '').includes('RUB')) || fiat[0];
      
      // Ищем USDT TON
      const defaultToCrypto = crypto.find(c => 
        (c.viewname || '').toLowerCase().includes('tether') && 
        (c.viewname || '').toLowerCase().includes('ton')
      ) || crypto.find(c => (c.viewname || '').toLowerCase().includes('tether')) || crypto[0];
      
      if (currentMode === 'buy') {
        currentFrom = defaultFromFiat;
        currentTo = defaultToCrypto;
      } else {
        currentFrom = defaultToCrypto;
        currentTo = defaultFromFiat;
      }
      
      updateSelectors();
      loadRates();
    }
  } catch (e) {
    console.error('Currencies load error:', e);
    document.getElementById('fromValue').textContent = t.error;
    document.getElementById('toValue').textContent = t.error;
  }
}

async function loadChangers() {
  try {
    const res = await fetch(`/api/bestchange/changers/${currentLang}`);
    const data = await res.json();
    if (data.success && data.data?.changers) {
      changersMap = {};
      data.data.changers.forEach(c => changersMap[c.id] = c);
    }
  } catch (e) {
    console.error('Changers load error:', e);
  }
}

async function loadRates() {
  if (!currentFrom || !currentTo) return;
  
  document.getElementById('exchangersList').innerHTML = '<div class="loader"><div class="loader-spinner"></div></div>';
  
  try {
    const res = await fetch(`/api/bestchange/rates/${currentFrom.id}/${currentTo.id}`);
    const data = await res.json();
    if (data.success && data.data?.rates) {
      const pairKey = `${currentFrom.id}-${currentTo.id}`;
      const rates = data.data.rates[pairKey] || [];
      
      // ЖЕЛЕЗОБЕТОННАЯ СОРТИРОВКА
      allRates = rates
        .filter(r => parseFloat(r.reserve) > 0)
        .sort((a, b) => {
          const rateA = parseFloat(a.rate);
          const rateB = parseFloat(b.rate);
          
          let goodnessA, goodnessB;
          
          if (currentMode === 'buy') {
            // ПОКУПКА: хотим максимум "to" (крипты) за 1 "from" (фиат).
            // Если rate < 1, это уже "крипта за фиат". Если > 1, инвертируем.
            goodnessA = rateA < 1 ? rateA : 1 / rateA;
            goodnessB = rateB < 1 ? rateB : 1 / rateB;
          } else {
            // ПРОДАЖА: хотим максимум "to" (фиата) за 1 "from" (крипту).
            // Если rate < 1, это "крипта за фиат", инвертируем. Если > 1, это "фиат за крипту".
            goodnessA = rateA < 1 ? 1 / rateA : rateA;
            goodnessB = rateB < 1 ? 1 / rateB : rateB;
          }
          
          // Сортируем по убыванию "полезности" (от лучшего к худшему)
          return goodnessB - goodnessA;
        });
      
      // Режем только для отображения
      displayedCount = 10;
      currentRates = allRates.slice(0, displayedCount);
      
      renderExchangers();
      calculate();
      updateLoadMoreBtn();
    } else {
      allRates = [];
      currentRates = [];
      displayedCount = 10;
      renderExchangers();
      updateLoadMoreBtn();
    }
  } catch (e) {
    console.error('Rates load error:', e);
    allRates = [];
    currentRates = [];
    displayedCount = 10;
    renderExchangers();
    updateLoadMoreBtn();
  }
}

// ===== UI =====
function updateSelectors() {
  if (currentFrom) {
    document.getElementById('fromValue').textContent = formatCurrencyName(currentFrom);
  }
  if (currentTo) {
    document.getElementById('toValue').textContent = formatCurrencyName(currentTo);
  }
}

function formatCurrencyName(c) {
  return `${c.viewname || c.name} (${c.name})`;
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('buyBtn').classList.toggle('active', mode === 'buy');
  document.getElementById('sellBtn').classList.toggle('active', mode === 'sell');
  document.querySelector('#buyBtn img').style.filter = mode === 'buy' ? 'brightness(1)' : 'brightness(0.5)';
  document.querySelector('#sellBtn img').style.filter = mode === 'sell' ? 'brightness(1)' : 'brightness(0.5)';
  document.querySelector('#buyBtn span').style.color = mode === 'buy' ? '#ffcc44' : '#8899aa';
  document.querySelector('#sellBtn span').style.color = mode === 'sell' ? '#ffcc44' : '#8899aa';
  
  // Меняем валюты местами
  const tmp = currentFrom;
  currentFrom = currentTo;
  currentTo = tmp;
  
  // Сбрасываем всё и перезагружаем
  currentRates = [];
  document.getElementById('exchangersList').innerHTML = '<div class="loader"><div class="loader-spinner"></div></div>';
  document.getElementById('exchangersCount').textContent = '';
  document.getElementById('calcResult').textContent = '≈ 0.00';
  document.getElementById('calcRate').textContent = '—';
  
  updateSelectors();
  loadRates();
}

function calculate() {
  const amount = parseFloat(document.getElementById('calcInput').value) || 0;
  if (!currentRates.length || amount <= 0) {
    document.getElementById('calcResult').textContent = `≈ 0.00`;
    document.getElementById('calcRate').textContent = '—';
    return;
  }

  const bestRate = parseFloat(currentRates[0].rate) || 0;
  const fromIsFiat = isLikelyFiat(currentFrom);
  const toIsFiat = isLikelyFiat(currentTo);

  let result = 0;
  let rateText = '';
  let displayRate = 0;

  // Определяем, как BestChange отдаёт курс
  // Если rate < 1 и fromIsFiat && !toIsFiat (RUB → USDT), значит rate = "сколько USDT за 1 RUB"
  // Если rate < 1 и !fromIsFiat && toIsFiat (USDT → RUB), значит rate = "сколько from за 1 to" (инвертировано)
  
  if (fromIsFiat && !toIsFiat) {
    // Фиат → Крипта (RUB → USDT)
    if (bestRate < 1) {
      // rate = "сколько крипты за 1 фиат" (например, 0.0159 USDT за 1 RUB)
      result = amount * bestRate;
      displayRate = bestRate;
      rateText = `1 ${currentFrom.viewname} = ${formatNumber(displayRate)} ${currentTo.viewname}`;
    } else {
      // rate = "сколько фиата за 1 крипту" (например, 62.8 RUB за 1 USDT)
      result = amount / bestRate;
      displayRate = 1 / bestRate;
      rateText = `1 ${currentTo.viewname} = ${formatNumber(1/displayRate)} ${currentFrom.viewname}`;
    }
  } else if (!fromIsFiat && toIsFiat) {
    // Крипта → Фиат (USDT → RUB)
    if (bestRate < 1) {
      // rate инвертирован: "сколько from за 1 to" (например, 0.0159 USDT за 1 RUB)
      // Нам нужно: сколько RUB за 1 USDT
      displayRate = 1 / bestRate;
      result = amount * displayRate;
      rateText = `1 ${currentFrom.viewname} = ${formatNumber(displayRate)} ${currentTo.viewname}`;
    } else {
      // rate прямой: "сколько to за 1 from" (например, 62.8 RUB за 1 USDT)
      displayRate = bestRate;
      result = amount * bestRate;
      rateText = `1 ${currentFrom.viewname} = ${formatNumber(displayRate)} ${currentTo.viewname}`;
    }
  } else {
    // Крипта → Крипта
    result = amount * bestRate;
    displayRate = bestRate;
    rateText = `1 ${currentFrom.viewname} = ${formatNumber(displayRate)} ${currentTo.viewname}`;
  }

  document.getElementById('calcResult').textContent = `≈ ${formatNumber(result)} ${currentTo.viewname}`;
  document.getElementById('calcRate').textContent = `${t.bestRate}: ${rateText}`;
}

function formatNumber(n) {
  if (n >= 1000) return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
  if (n >= 1) return n.toFixed(4);
  return n.toFixed(6);
}

function formatReserve(n) {
  const num = parseFloat(n);
  if (num >= 1000000) return (num / 1000000).toFixed(2) + 'M';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return num.toFixed(0);
}

function renderExchangers() {
  const list = document.getElementById('exchangersList');
  const countEl = document.getElementById('exchangersCount');
  
  if (!currentRates.length) {
    list.innerHTML = `<div class="loader">${t.noExchangers}</div>`;
    countEl.textContent = '';
    updateLoadMoreBtn();
    return;
  }
  
  countEl.textContent = `(${currentRates.length})`;
  const fromIsFiat = isLikelyFiat(currentFrom);
  const toIsFiat = isLikelyFiat(currentTo);
  
  list.innerHTML = currentRates.map((r, idx) => {
    const changer = changersMap[r.changer] || { name: `Exchange #${r.changer}`, rating: 0, reviews: {} };
    const reviews = changer.reviews || {};
    const totalReviews = (reviews.positive || 0) + (reviews.neutral || 0) + (reviews.closed || 0);
    const rate = parseFloat(r.rate) || 0;
    const reserve = parseFloat(r.reserve);
    const inmin = parseFloat(r.inmin || 0);
    const inmax = parseFloat(r.inmax || 0);
    
    let rateText = '';
    let displayRate = 0;
    
    if (fromIsFiat && !toIsFiat) {
      if (rate < 1) {
        displayRate = rate;
        rateText = `1 ${currentFrom.viewname} = ${formatNumber(displayRate)} ${currentTo.viewname}`;
      } else {
        displayRate = 1 / rate;
        rateText = `1 ${currentTo.viewname} = ${formatNumber(1/displayRate)} ${currentFrom.viewname}`;
      }
    } else if (!fromIsFiat && toIsFiat) {
      if (rate < 1) {
        displayRate = 1 / rate;
        rateText = `1 ${currentFrom.viewname} = ${formatNumber(displayRate)} ${currentTo.viewname}`;
      } else {
        displayRate = rate;
        rateText = `1 ${currentFrom.viewname} = ${formatNumber(displayRate)} ${currentTo.viewname}`;
      }
    } else {
      displayRate = rate;
      rateText = `1 ${currentFrom.viewname} = ${formatNumber(displayRate)} ${currentTo.viewname}`;
    }
    
    return `
      <div class="exchanger-card ${idx === 0 ? 'best' : ''}">
        <div class="exchanger-header">
          <div class="exchanger-name">${idx === 0 ? '🥇 ' : ''}${changer.name}</div>
          <div class="exchanger-rating">⭐ ${(changer.rating || 0).toFixed(1)} (${totalReviews})</div>
        </div>
        <div class="exchanger-stats">
          <div class="stat">💰 <strong>${rateText}</strong></div>
          <div class="stat">📦 ${t.reserve}: <strong>${formatReserve(reserve)} ${currentTo.viewname}</strong></div>
          <div class="stat" style="grid-column: span 2;">💵 ${t.minMax}: <strong>${formatNumber(inmin)} — ${formatNumber(inmax)} ${currentFrom.viewname}</strong></div>
        </div>
        <button class="exchanger-btn" onclick="goToExchanger(${r.changer})">🔗 ${t.goTo}</button>
      </div>
    `;
  }).join('');
  
  updateLoadMoreBtn();
}

function loadMoreExchangers() {
  displayedCount += 10;
  currentRates = allRates.slice(0, displayedCount);
  renderExchangers();
}

function updateLoadMoreBtn() {
  const btn = document.getElementById('loadMoreBtn');
  if (!btn) return;
  if (displayedCount < allRates.length) {
    btn.style.display = 'block';
    btn.textContent = `🔽 Загрузить ещё (осталось ${allRates.length - displayedCount})`;
  } else {
    btn.style.display = 'none';
  }
}

function goToExchanger(changerId) {
  const changer = changersMap[changerId];
  const url = changer?.urls?.[currentLang] || changer?.urls?.en || `https://www.bestchange.com/click.php?id=${changerId}&p=${partnerId}`;
  window.open(url, '_blank');
}
function openBestChange() {
  const url = `https://www.bestchange.com/?p=${partnerId}`;
  window.open(url, '_blank');
}

// ===== МОДАЛЬНОЕ ОКНО =====
let modalType = 'from';

function openModal(type) {
  modalType = type;
  document.getElementById('currencyModal').classList.add('active');
  document.getElementById('modalSearch').value = '';
  document.getElementById('modalTitle').textContent = type === 'from' ? t.modalTitleFrom : t.modalTitleTo;
  renderModalList();
  setTimeout(() => document.getElementById('modalSearch').focus(), 100);
}

function closeModal() {
  document.getElementById('currencyModal').classList.remove('active');
}

function renderModalList(filter = '') {
  const f = filter.toLowerCase().trim();
  
  // Определяем, что выбираем: фиат или крипту
  const isSelectingFiat = (modalType === 'from' && currentMode === 'buy') || 
                          (modalType === 'to' && currentMode === 'sell');
  
  // Фильтруем ТОЛЬКО нужный тип
  let filtered = allCurrencies.filter(c => {
    if (f) {
      const match = (c.viewname || '').toLowerCase().includes(f) ||
                    (c.name || '').toLowerCase().includes(f);
      if (!match) return false;
    }
    return isSelectingFiat ? isLikelyFiat(c) : !isLikelyFiat(c);
  });
  
  // Сортируем популярные сверху
  const popularCodes = isSelectingFiat 
  ? ['RUB', 'RUR', 'SBER', 'TINKOFF', 'QIWI', 'YOMONEY', 'USD', 'EUR', 'KZT', 'UAH', 'CNY', 'TRY', 'GBP']
  : ['USDT', 'USDTTRC', 'USDTERC', 'USDT TON', 'TON', 'BTC', 'ETH', 'BNB', 'SOL', 'XRP'];

filtered.sort((a, b) => {
  const aPopular = popularCodes.includes(a.code) || popularCodes.some(p => (a.viewname || '').toUpperCase().includes(p));
  const bPopular = popularCodes.includes(b.code) || popularCodes.some(p => (b.viewname || '').toUpperCase().includes(p));
  if (aPopular && !bPopular) return -1;
  if (!aPopular && bPopular) return 1;
  return (a.viewname || '').localeCompare(b.viewname || '');
});

const limited = filtered;
  
  document.getElementById('modalList').innerHTML = limited.map(c => `
    <div class="modal-item" onclick="selectCurrency(${c.id})">
      <div class="name">${c.viewname || c.name}</div>
      <div class="code">${c.name}</div>
    </div>
  `).join('') || `<div class="loader">${t.noExchangers}</div>`;
}

function filterCurrencies() {
  const filter = document.getElementById('modalSearch').value;
  renderModalList(filter);
}

function selectCurrency(id) {
  const currency = allCurrencies.find(c => c.id === id);
  if (!currency) return;
  
  if (modalType === 'from') {
    currentFrom = currency;
  } else {
    currentTo = currency;
  }
  
  updateSelectors();
  loadRates();
  closeModal();
}

  await loadPartnerId();
  await Promise.all([loadCurrencies(), loadChangers()]);
