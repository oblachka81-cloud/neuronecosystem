<script>
(function(){
  if (document.referrer && (document.referrer.includes('/exchange') || document.referrer.includes('/casino') || document.referrer.includes('/bank') || document.referrer.includes('/support'))) {
  document.body.style.visibility = 'visible';
  document.getElementById('quasarSplash').classList.add('qs-hidden');
  return;
}
  
  document.body.style.visibility = 'visible';
  const splash = document.getElementById('quasarSplash');
  const video = document.getElementById('splashVideo');
  const canvas = document.getElementById('neuralCanvas');
  const ctx = canvas.getContext('2d');
  
  const today = new Date();
  const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
  const videoCount = 7;
  const index = (dayOfYear % videoCount) + 1;
  const videoPath = '/videos/splash_' + String(index).padStart(2, '0') + '.mp4';
  
  let W, H, nodes = [], particles = [], startTime = performance.now();
  const COLORS = ['#00ffff','#a855f7','#ff6600'];
  let fallbackActive = false;
  
  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();
  
  for(let i=0;i<40;i++) nodes.push({ x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4, r: Math.random()*2.5+1.5, color: COLORS[Math.floor(Math.random()*COLORS.length)], pulse: Math.random()*Math.PI*2 });
  for(let i=0;i<120;i++){
    const side = Math.floor(Math.random()*4);
    let sx,sy;
    if(side===0){sx=Math.random()*W;sy=-10;}
    else if(side===1){sx=W+10;sy=Math.random()*H;}
    else if(side===2){sx=Math.random()*W;sy=H+10;}
    else{sx=-10;sy=Math.random()*H;}
    particles.push({ sx,sy, x:sx, y:sy, delay: Math.random()*1.5+1.5, dur: Math.random()*0.8+0.5, color: COLORS[Math.floor(Math.random()*COLORS.length)], r: Math.random()*2+1 });
  }
  
  function easeInOut(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
  
  function draw(){
    if(!fallbackActive) return;
    const elapsed = (performance.now()-startTime)/1000;
    ctx.clearRect(0,0,W,H);
    const cx=W/2, cy=H/2;
    const netOpacity = elapsed < 3 ? Math.min(1, elapsed/0.8) : Math.max(0,(4-elapsed)/0.5);
    
    if(netOpacity>0){
      ctx.globalAlpha = netOpacity * 0.6;
      for(let i=0;i<nodes.length;i++){
        for(let j=i+1;j<nodes.length;j++){
          const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
          const dist=Math.sqrt(dx*dx+dy*dy);
          if(dist<120){
            const alpha=(1-dist/120)*0.4;
            ctx.globalAlpha=netOpacity*alpha;
            ctx.strokeStyle=nodes[i].color;
            ctx.lineWidth=0.8;
            ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();
            const t=((elapsed*0.8)+i*0.3)%1;
            const px=nodes[i].x+dx*(-t), py=nodes[i].y+dy*(-t);
            ctx.globalAlpha=netOpacity*alpha*2;
            ctx.fillStyle='#00ffff';
            ctx.beginPath();ctx.arc(px,py,1.5,0,Math.PI*2);ctx.fill();
          }
        }
      }
      nodes.forEach(n=>{
        n.pulse+=0.04;
        const glow=Math.sin(n.pulse)*0.3+0.7;
        ctx.globalAlpha=netOpacity*glow;
        ctx.fillStyle=n.color;
        ctx.shadowColor=n.color;
        ctx.shadowBlur=8;
        ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
        n.x+=n.vx;n.y+=n.vy;
        if(n.x<0||n.x>W) n.vx*=-1;
        if(n.y<0||n.y>H) n.vy*=-1;
      });
    }
    
    ctx.globalAlpha=1;
    particles.forEach(p=>{
      const t = Math.max(0, Math.min(1, (elapsed - p.delay) / p.dur));
      if(t<=0||t>=1) return;
      const et=easeInOut(t);
      p.x = p.sx + (cx - p.sx)*et;
      p.y = p.sy + (cy - p.sy)*et;
      const alpha=(1-Math.abs(t-0.5)*2)*0.9;
      ctx.globalAlpha=alpha;
      ctx.fillStyle=p.color;
      ctx.shadowColor=p.color;
      ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    });
    
    if(elapsed>2.5 && elapsed<4.2){
      const gt=Math.min(1,(elapsed-2.5)/0.8);
      const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,120);
      grd.addColorStop(0,`rgba(0,200,255,${0.18*gt})`);
      grd.addColorStop(0.5,`rgba(168,85,247,${0.10*gt})`);
      grd.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=1;
      ctx.fillStyle=grd;
      ctx.beginPath();ctx.arc(cx,cy,120,0,Math.PI*2);ctx.fill();
    }
    
    ctx.globalAlpha=1;
    if(elapsed < 4.5) requestAnimationFrame(draw);
  }
  
  function startFallback(){
    if(fallbackActive) return;
    fallbackActive = true;
    splash.classList.remove('video-mode');
    splash.classList.add('canvas-mode');
    startTime = performance.now();
    draw();
  }
  
  function hideSplash(){
    splash.classList.add('qs-hidden');
    setTimeout(() => {
      video.pause();
      video.src = '';
      canvas.style.display = 'none';
    }, 1000);
  }
  
  video.src = videoPath;
  video.load();
  
  video.addEventListener('canplaythrough', function(){
    splash.classList.add('video-mode');
    video.play().catch(function(){
      startFallback();
    });
  });
  
  video.addEventListener('ended', hideSplash);
  video.addEventListener('error', startFallback);

  setTimeout(function(){
    if(!splash.classList.contains('video-mode') && !fallbackActive) startFallback();
  }, 3000);

  video.addEventListener('loadedmetadata', function() {
    const maxDuration = (video.duration || 10) + 2;
    setTimeout(function() {
      if (splash.style.display !== 'none' && !splash.classList.contains('qs-hidden')) {
        hideSplash();
      }
    }, maxDuration * 1000);
  });

  window._hideSplash = hideSplash;
})();
</script>

  const BASE_URL = window.location.origin;
  const urlParams = new URLSearchParams(window.location.search); 
  const tg = window.Telegram?.WebApp ?? {
    expand:()=>{}, MainButton:{hide:()=>{}}, initDataUnsafe:{}, initData:'',
    showAlert:(msg)=>alert(msg), openInvoice:(url,cb)=>{window.open(url);cb&&cb('cancelled')}
  };

  function authFetch(url, opts = {}) {
    const initData = tg.initData || '';
    if (!initData) {
      showToast((typeof t !== 'undefined' && t.errAuth) || 'Открой приложение через Telegram', 3000);
      return Promise.reject(new Error('No initData'));
    }
    return fetch(url, {
      ...opts,
      headers: {
        ...(opts.headers || {}),
        'X-Telegram-Init-Data': initData
      }
    });
  }

  try{tg.expand();}catch(e){}
  try{tg.MainButton.hide();}catch(e){}

  let userId, userName;
  let tonPaymentContext = 'super_game';

  initTonConnect();
  window.addEventListener('load', () => { initTonConnect(); });

  window.addEventListener('message', async (event) => {
    if (event.data === 'switchTab:game') {
      switchTab('game');
      return;
    }
    if (event.data?.type === 'BANK_REQUEST_TRANSACTION') {
      const bankFrame = document.querySelector('iframe[src*="/bank"]');
      if (!tonConnectUI || !tonConnectUI.account) {
        bankFrame?.contentWindow?.postMessage({ type: 'BANK_NO_WALLET' }, '*');
        return;
      }
      bankFrame?.contentWindow?.postMessage({ type: 'BANK_WALLET_INFO', walletAddress: tonConnectUI.account.address, amt: event.data.amt, userId: event.data.userId }, '*');
      return;
    }
    if (event.data?.type === 'BANK_SEND_TRANSACTION') {
      const bankFrame = document.querySelector('iframe[src*="/bank"]');
      try {
        await tonConnectUI.sendTransaction(event.data.transaction);
        bankFrame?.contentWindow?.postMessage({ type: 'BANK_TX_SUCCESS' }, '*');
      } catch(e) {
        bankFrame?.contentWindow?.postMessage({ type: 'BANK_TX_ERROR', error: e.message, code: e.code }, '*');
      }
      return;
    }
  });

  setTimeout(() => startApp(1), 300);
  setTimeout(preloadTabImages, 2000);

  (function() {
    const videoContainer = document.getElementById('liveBgVideo');
    const video = document.getElementById('mainBgVid');
    if (!videoContainer || !video) return;

    video.load();

    video.addEventListener('canplaythrough', function() {
      video.play().catch(function() {
        console.log('Autoplay blocked, keeping static WebP');
      });
      videoContainer.style.opacity = '1';
    });

    setTimeout(function() {
      if (videoContainer.style.opacity !== '1') {
        console.log('Video load timeout, keeping static WebP');
      }
    }, 6000);
  })();
</script>
